name: SDD CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN scope. The workflow only reads the repo to run
# framework tests + the scope-guard diff; it does not post comments, create
# checks via the API, push commits, or write any other resource. If a future
# step needs additional scope, add the most-restrictive `read` value here —
# never `write`.
permissions:
  contents: read
  pull-requests: read

jobs:
  framework-tests:
    name: Framework tests (mutation-verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test/run-framework-test.sh
        shell: bash
        run: |
          bash test/run-framework-test.sh

  claims-audit:
    name: Claims audit (proof-by-execution of marketing claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (PyYAML for the framework's own scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Run test/run-claims-audit.sh
        shell: bash
        env:
          # Wire GITHUB_TOKEN through to gh CLI so the shipped-PR-status
          # claim can authenticate against private repo PRs. The token
          # is read-only per the workflow's `permissions: contents: read`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash test/run-claims-audit.sh

  scope-guard:
    name: Scope guard (UI copy + new-file spec refs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        shell: bash
        run: |
          # PR diff range: from PR base ref to PR head.
          base="origin/${{ github.event.pull_request.base.ref }}"
          head="HEAD"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Scope-guard — UI copy ≥30 chars must be in spec.md or wireframe.html
        shell: bash
        run: |
          set -uo pipefail
          # Phase-C-7 (1/N) replacement of pre-commit-scope-guard.sh's local
          # hook. Runs against the PR diff rather than the staged set.
          # Same logic; CI lifecycle = no committer dev-loop interruption,
          # but PRs still gated.

          base="${{ steps.diff.outputs.base }}"
          head="${{ steps.diff.outputs.head }}"

          # Only run if there's an active SDD work item with at least one of
          # spec.md or wireframe.html present (checked further down).
          [ -d .sdd ] || { echo "[scope-guard-ci] no .sdd/ — skipping."; exit 0; }
          [ -f .sdd/INDEX.md ] || { echo "[scope-guard-ci] no INDEX.md — skipping."; exit 0; }

          active=$(awk '/^\*\*Active:\*\*/{print $2; exit}' .sdd/INDEX.md 2>/dev/null || echo "")
          echo "$active" | grep -qE '^[a-z][a-z0-9_-]*/[A-Za-z0-9._-]+$' || active=""
          [ -z "$active" ] && { echo "[scope-guard-ci] no active work item — skipping."; exit 0; }

          spec=".sdd/$active/spec.md"
          wireframe=".sdd/$active/wireframe.html"
          # Copy is valid if it appears in spec.md OR wireframe.html — so a
          # non-UI feature with no wireframe should still have its copy
          # verified against spec.md. Only skip when BOTH are missing.
          if [ ! -f "$spec" ] && [ ! -f "$wireframe" ]; then
            echo "[scope-guard-ci] both spec and wireframe missing — skipping."
            exit 0
          fi

          # Phase gate: BUILD or SHIP only. Phase is encoded in spec.md, so
          # if spec.md is missing we cannot read the phase. In that case
          # (wireframe-only) skip the gate and let the per-string loop run —
          # it will simply check copy against the wireframe.
          phase="(unknown)"
          if [ -f "$spec" ]; then
            phase=$(grep -m1 -oE '\[PHASE: [A-Z]+\]' "$spec" | grep -oE '[A-Z]+' | tail -1 || echo "")
            case "$phase" in
              BUILD|SHIP) ;;
              *) echo "[scope-guard-ci] phase=$phase — scope-guard only runs BUILD/SHIP. skipping."; exit 0 ;;
            esac
          fi

          # ─── Block 1: UI copy strings ─────────────────────────────────
          # UI paths only — backend / scripts / tests don't need their copy
          # strings cross-referenced against wireframe/spec. Path-spec mirrors
          # Block 2's new-UI-files filter (app/, components/, pages/, src/*).
          #
          # Range form: `$base...$head` (three-dot). This is the PR-diff
          # form — it diffs HEAD against the merge-base of base and HEAD,
          # so commits that landed on main AFTER this PR branched are not
          # counted as PR changes. The two-dot form (`$base..$head`) would
          # let post-branch main commits leak in, producing false-positive
          # violations on copy this PR never touched.
          #
          # Added-line filter: `grep -E '^\+[^+]'` keeps lines that start
          # with one `+` followed by a non-`+` character. This excludes the
          # `+++ b/path` file-header line that `--unified=0` still emits;
          # without the negation, file paths with quote-like chars could
          # slip into the per-string check.
          # Copy-extractor regex: capture quoted/templated UI strings ≥30
          # chars from added lines. Covers four shapes:
          #   "double-quoted"  → most JSX attribute strings
          #   'single-quoted'  → JS/TS string literals
          #   `template literal` → JSX text and string interpolation
          #   >JSX text<  → bare JSX children between tags
          # Pattern built into a variable so the bash quoting is
          # readable. Single quote inside a single-quoted bash string
          # is encoded as '\'' (close, escaped quote, reopen).
          # CodeRabbit cycle 9/10: earlier regex missed single-quoted
          # and backtick-template strings.
          # Issue #33 (v0.9.2): handle escape sequences. Earlier the
          # `[^"]{30,}` form would split on inline `\"` escapes (the inner
          # `"` would terminate the match early). Now: each delimiter
          # uses a `([^delim\\]|\\.){30,}` form that allows escaped
          # characters within the string. Same pattern for single
          # quotes and backticks. JSX text `>...<` doesn't have escape
          # semantics so it's unchanged.
          # Read scope_guard config from the consumer project's
          # .sdd/config.md (closes #16). Defaults match the previously-
          # hardcoded Next.js shape, so existing projects keep their
          # behaviour without any config change.
          SG_HELPER=".sdd/scripts/scope-guard-config.sh"
          if [ -x "$SG_HELPER" ]; then
            mapfile -t globs < <(bash "$SG_HELPER" --globs)
            min_chars=$(bash "$SG_HELPER" --min-chars)
          else
            # Helper missing (e.g. older project that hasn't picked up
            # v1.x yet) — fall back to the v0.13.x hardcoded shape so
            # the workflow doesn't error on missing helper.
            # Use a bash array literal (NOT a heredoc) — heredoc bodies
            # at column 0 break out of the YAML `run: |` block scalar
            # and leave the workflow invalid YAML. CR cycle-1 critical.
            globs=(
              'app/**/*.tsx' 'app/**/*.jsx' 'app/**/*.ts' 'app/**/*.js'
              'components/**/*.tsx' 'components/**/*.jsx' 'components/**/*.ts' 'components/**/*.js'
              'pages/**/*.tsx' 'pages/**/*.jsx' 'pages/**/*.ts' 'pages/**/*.js'
              'src/app/**/*.tsx' 'src/app/**/*.jsx' 'src/app/**/*.ts' 'src/app/**/*.js'
              'src/components/**/*.tsx' 'src/components/**/*.jsx' 'src/components/**/*.ts' 'src/components/**/*.js'
              'src/pages/**/*.tsx' 'src/pages/**/*.jsx' 'src/pages/**/*.ts' 'src/pages/**/*.js'
            )
            min_chars=30
          fi
          copy_re='"([^"\\]|\\.){'"$min_chars"',}"|'"'"'([^'"'"'\\]|\\.){'"$min_chars"',}'"'"'|`([^`\\]|\\.){'"$min_chars"',}`|>[^<>]{'"$min_chars"',}<'
          added_strings=$(git diff --unified=0 "$base...$head" -- "${globs[@]}" \
            2>/dev/null \
            | grep -E '^\+[^+]' \
            | grep -oE "$copy_re" \
            | sed -E "s/^[\"'\`>]|[<\"'\`]$//g" \
            | sort -u || true)

          # Per-string check. Try $spec if it exists, then $wireframe if it
          # exists. A missing file is a no-op (not a false-positive miss) —
          # the combined-skip above guarantees at least one is present.
          violations=()
          if [ -n "$added_strings" ]; then
            while IFS= read -r str; do
              [ -z "$str" ] && continue
              if [ -f "$wireframe" ] && grep -qF -- "$str" "$wireframe" 2>/dev/null; then continue; fi
              if [ -f "$spec" ]      && grep -qF -- "$str" "$spec"      2>/dev/null; then continue; fi
              if [ -f "$wireframe" ] && grep -qiF -- "$str" "$wireframe" 2>/dev/null; then continue; fi
              if [ -f "$spec" ]      && grep -qiF -- "$str" "$spec"      2>/dev/null; then continue; fi
              violations+=("$str")
            done <<< "$added_strings"
          fi

          if [ ${#violations[@]} -gt 0 ]; then
            # Report whichever source files actually exist — a wireframe-less
            # feature shouldn't see "Wireframe: <missing-path>" in its error.
            sources=""
            [ -f "$spec" ] && sources="$spec"
            [ -f "$wireframe" ] && sources="${sources:+$sources, }$wireframe"
            {
              echo "::error::[SDD scope-guard] PR adds copy strings not in spec.md or wireframe.html"
              echo ""
              echo "  Active feature: $active"
              echo "  Phase:          $phase"
              echo "  Checked:        $sources"
              echo ""
              echo "  Unspec'd strings:"
              for v in "${violations[@]}"; do
                preview=$(echo "$v" | head -c 120)
                echo "    • \"$preview\""
              done
              echo ""
              echo "  Pick one:"
              if [ -f "$wireframe" ]; then
                echo "  1. Legitimate but missed: add the copy/element to wireframe.html,"
                echo "     get it re-approved, force-push the branch."
              else
                echo "  1. Legitimate but missed: add the copy/element to spec.md,"
                echo "     get it re-approved, force-push the branch."
              fi
              echo "  2. Not requested: remove the unspec'd copy, force-push."
            } >&2
            exit 1
          fi

          # ─── Block 2: new traceable files (UI + backend) must carry a `// spec:` reference ──
          # Range form: three-dot — same reason as Block 1 above. Files
          # added on main after the PR branched must not count as files
          # this PR added.
          # Path-prefix regex from the same scope_guard config (closes #16).
          # Defaults match the v0.13.x hardcoded shape if the helper is
          # missing.
          if [ -x "$SG_HELPER" ]; then
            ui_path_re=$(bash "$SG_HELPER" --regex)
          else
            # Fallback regex: covers UI (app/components/pages/src/...) AND
            # backend (api routes, migrations, server code) traceable paths.
            # Variable name `ui_path_re` is legacy from the v0.13.x UI-only
            # era; the regex now covers both UI and backend.
            ui_path_re='^(app|components|pages|src/app|src/components|src/pages|app/api|pages/api|routes|migrations|server|src/api|src/server|lib/db|db)/.*\.(tsx|jsx|ts|js|py|rb|go|sql)$'
          fi
          # Validate the regex compiles (CR cycle-3 major). Without
          # this check, a malformed scope_guard config in a downstream
          # project would silently mask Block 2 via `|| true` and any
          # new UI file slipping through with no `// spec:` reference
          # would never be flagged. Fail fast instead.
          #
          # Validate the regex with the SAME engine that runs it below
          # (grep -E / POSIX ERE). CR cycle 3 caught dialect drift:
          # an earlier Python `re.compile` form would pass POSIX-invalid
          # patterns (e.g. Python's `(?P<name>...)`) that grep then
          # silently drops via `|| true`, masking scope-guard failures.
          # grep exits 2 for "invalid regex" and 1 for "valid but no
          # match" — that's the distinguisher.
          # The `&& rc=0 || rc=$?` chain is exempt from `set -e`, which
          # would otherwise abort on grep's expected rc=1 (no match).
          grep -E "$ui_path_re" </dev/null >/dev/null 2>&1 && grep_rc=0 || grep_rc=$?
          if [ "$grep_rc" -eq 2 ]; then
            echo "::error::[SDD scope-guard] ui_path_re from scope_guard config does not compile as a POSIX-ERE regex: '$ui_path_re'"
            echo "::error::Fix: check .sdd/config.md scope_guard.file_extensions / ui_dirs for invalid characters."
            exit 1
          fi
          new_ui_files=$(git diff --name-only --diff-filter=A "$base...$head" 2>/dev/null \
            | grep -E "$ui_path_re" \
            | grep -vE '\.test\.|\.spec\.|/tests?/' \
            || true)

          missing_ref=()
          if [ -n "$new_ui_files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # Match `// spec:` (JS/TS/Go), `/* spec:` / `* spec:` (JS/TS
              # block comments), `# spec:` (Python/Ruby), `-- spec:` (SQL).
              if ! head -10 "$file" | grep -qE '(//|/\*|\*|#|--).*spec:\s*(features/|\.sdd/|\S+\.md)' ; then
                missing_ref+=("$file")
              fi
            done <<< "$new_ui_files"
          fi

          if [ ${#missing_ref[@]} -gt 0 ]; then
            {
              echo "::error::[SDD scope-guard] new files missing \`// spec:\` reference (UI + backend)"
              echo ""
              echo "  Files:"
              for f in "${missing_ref[@]}"; do
                echo "    • $f"
              done
              echo ""
              echo "  Add a comment in the first 10 lines. Use the comment"
              echo "  syntax that matches the file's language:"
              echo "    JS/TS/Go: // spec: ..."
              echo "    Python/Ruby: # spec: ..."
              echo "    SQL: -- spec: ..."
              if [ -f "$spec" ]; then
                echo "  e.g. // spec: $spec §3 US2 — <what this file is for>"
              else
                echo "  e.g. // spec: $wireframe — <what this file is for>"
              fi
            } >&2
            exit 1
          fi

          echo "[scope-guard-ci] OK — no unspec'd copy or missing-ref UI files."

  graph-integrity:
    # v1.0 step 4 (closes #26) — broken wiki-links fail the PR. Mirrors the
    # post-stop-lint.sh invariant 8 check at merge boundary, so even a
    # `git commit --no-verify` bypass that lands a broken `[[slug]]` in a
    # local commit gets caught here before merge.
    #
    # 2026-05-12 — removed `if: github.event_name == 'pull_request'`. The
    # PR-only gate let a broken wiki-link land on main via direct push
    # (commit 5d9fb60's audit-close entry referenced `[[2026-05-12-backlog-
    # book-close]]` before its stub folder existed). The check has no
    # diff-against-base assumption — it just scans `.sdd/` end-to-end —
    # so running it on push too is strictly safer.
    name: Graph integrity (wiki-links resolve)
    runs-on: ubuntu-latest
    # CR cycle-6 — explicit timeout. The job depends on a networked pip
    # install + a graph build over .sdd/; in the rare case of a hung
    # runner, the per-job timeout keeps PR flow unblocked.
    timeout-minutes: 5
    steps:
      # SHA-pinned for supply-chain hygiene — this job gates merge into main,
      # so a poisoned upstream tag would let bad code land. Bump the SHAs
      # alongside the tag in the comment when actions/* releases.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        # Pinned to an exact version (CR cycle-5 supply-chain). PyYAML 6.0.2
        # is the most recent maintenance release as of v1.0; bump together
        # when upgrading.
        run: python -m pip install --quiet 'pyyaml==6.0.2'
      - name: Build graph + assert no broken wiki-links
        shell: bash
        run: |
          set -uo pipefail
          # The MCP server's _graph_cache lives under extensions/. Use it
          # directly rather than re-implementing the parser; that way the
          # CI gate and the post-stop-lint hook always agree on what
          # "broken" means.
          PYTHONPATH="$PWD/extensions/sdd-mcp-server" python3 - <<'PYEOF'
          import os, sys
          try:
              from queries import _graph_cache
          except ImportError as exc:
              print(f"::error::Graph cache helper failed to import: {type(exc).__name__}: {exc}", file=sys.stderr)
              sys.exit(1)
          # Build against the repo's own .sdd/ tree (the framework self-hosts).
          try:
              g = _graph_cache.build(os.environ.get("GITHUB_WORKSPACE", os.getcwd()))
          except Exception as exc:
              print(f"::error::Graph cache build failed: {type(exc).__name__}: {exc}", file=sys.stderr)
              sys.exit(1)
          broken = [e for e in _graph_cache.find_broken_edges(g)
                    if e.get("kind") == "wiki-link"]
          if not broken:
              print(f"[graph-integrity] OK — {len(g.get('nodes', []))} nodes, "
                    f"{len(g.get('edges', []))} edges, 0 broken wiki-links.")
              sys.exit(0)
          # Surface broken links as workflow errors so they appear inline on the PR.
          print(f"::error::[SDD graph-integrity] {len(broken)} wiki-link(s) don't resolve to a known node.", file=sys.stderr)
          print("", file=sys.stderr)
          for e in broken[:20]:
              raw = e.get("raw") or e.get("to_path", "?")
              src = e.get("from_path", "?")
              line = e.get("from_line", "?")
              print(f"  {src}:{line}  [[{raw}]]", file=sys.stderr)
          if len(broken) > 20:
              print(f"  …and {len(broken) - 20} more.", file=sys.stderr)
          print("", file=sys.stderr)
          print("  Fix: rename the link to match an existing node (feature folder,", file=sys.stderr)
          print("       pattern heading in patterns.md, entity heading in", file=sys.stderr)
          print("       data-model.md, or decision heading in decisions.md), or", file=sys.stderr)
          print("       create the target node.", file=sys.stderr)
          sys.exit(1)
          PYEOF
