name: Publish sdd-pi-adapter

on:
  push:
    tags:
      - 'pi-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish sdd-pi-adapter to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/sdd-pi-extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Skip if version already published (idempotence on tag re-run)
        id: check
        run: |
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version already on npm — re-run is a no-op"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.check.outputs.already != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
